# Report wording. Replace with your firm's quality-reviewed templates.
#
# The text follows the structure of a SOC 2 examination report under AICPA
# attestation standards (AT-C 105 and 205) and the SOC 2 description criteria
# (DC 200). It is written for this tool and is not AICPA illustrative text.
#
# Placeholders: {org} {system} {auditor} {period} {period_dates}
# {categories} {subservice} {basis_heading} {and_oe} {and_oe_lc} {and_operated}
# {and_operating} {or_oe} {tests_clause}

standards:
  description_criteria: "DC section 200, 2018 Description Criteria for a Description of a Service Organization's System in a SOC 2 Report (With Revised Implementation Guidance, 2022)"
  trust_services_criteria: "TSP section 100, 2017 Trust Services Criteria for Security, Availability, Processing Integrity, Confidentiality, and Privacy (With Revised Points of Focus, 2022)"

cover:
  title: "Report on {org}'s Description of Its {system} and on the Suitability of the Design{and_oe} of Its Controls Relevant to {categories_title}"
  restricted: "This report is intended solely for the specified parties listed in Section I. It is confidential and restricted in use."

section1:
  title: "Independent Service Auditor's Report"
  addressee: "To the Management of {org}"
  scope:
    type2: >-
      We have examined {org}'s accompanying description of its {system} {period} (the description), prepared in
      accordance with {description_criteria} (the description criteria), and the suitability of the design and
      operating effectiveness of the controls stated in the description {period} to provide reasonable assurance
      that {org}'s service commitments and system requirements were achieved based on the trust services criteria
      relevant to {categories} (the applicable trust services criteria) set forth in {trust_services_criteria}.
    type1: >-
      We have examined {org}'s accompanying description of its {system} {period} (the description), prepared in
      accordance with {description_criteria} (the description criteria), and the suitability of the design of the
      controls stated in the description {period} to provide reasonable assurance that {org}'s service commitments
      and system requirements would be achieved based on the trust services criteria relevant to {categories} (the
      applicable trust services criteria) set forth in {trust_services_criteria}.
  type1_no_oe: >-
    We did not perform procedures on the operating effectiveness of the controls stated in the description and
    therefore express no opinion on it.
  subservice: >-
    {org} uses {subservice}. The description covers only the controls of {org} and
    excludes the controls of these subservice organizations (the carve-out method). The description also states
    that some applicable trust services criteria are met only if complementary subservice organization controls,
    assumed in the design of {org}'s controls, are suitably designed{and_operating}, together with the related controls
    at {org}. Our examination did not extend to the controls of the subservice organizations, and we have not
    evaluated the suitability of design{or_oe} of those complementary controls.
  cuec: >-
    The description states that some applicable trust services criteria are met only if complementary user entity
    controls, assumed in the design of {org}'s controls, are suitably designed{and_operating}, together with the related
    controls at {org}. Our examination did not extend to those complementary user entity controls, and we have not
    evaluated their suitability of design{or_oe}.
  org_responsibilities:
    heading: "Service Organization's Responsibilities"
    text: >-
      {org} is responsible for its service commitments and system requirements, and for designing, implementing
      and operating effective controls within the system to provide reasonable assurance that they are achieved.
      {org} has provided the accompanying assertion (Section II) about the presentation of the description and the
      suitability of design{and_oe_lc} of its controls. {org} is also responsible for preparing the description and
      assertion, including their completeness, accuracy and method of presentation; for providing the services the
      description covers; for selecting the applicable trust services criteria and stating the related controls;
      and for identifying the risks that threaten the achievement of its service commitments and system requirements.
  auditor_responsibilities:
    heading: "Service Auditor's Responsibilities"
    text: >-
      Our responsibility is to express an opinion on the description and on the suitability of design{and_oe_lc} of
      the controls stated in it, based on our examination. We conducted our examination in accordance with
      attestation standards established by the American Institute of Certified Public Accountants. Those standards
      require us to plan and perform the examination to obtain reasonable assurance about whether, in all material
      respects, the description is presented in accordance with the description criteria and the controls stated in
      it were suitably designed{and_operated} to provide reasonable assurance that the service commitments and system
      requirements were achieved based on the applicable trust services criteria. We believe the evidence we
      obtained is sufficient and appropriate to provide a reasonable basis for our opinion.
    procedures_intro: "Our examination included:"
    procedures:
      - "obtaining an understanding of the system and of the service organization's service commitments and system requirements;"
      - "assessing the risks that the description is not presented in accordance with the description criteria and that controls were not suitably designed{or_did_not_operate};"
      - "performing procedures to obtain evidence about whether the description is presented in accordance with the description criteria;"
      - "performing procedures to obtain evidence about whether the controls stated in the description were suitably designed to provide reasonable assurance that the service commitments and system requirements would be achieved based on the applicable trust services criteria;"
      - "{oe_procedure}"
      - "evaluating the overall presentation of the description."
    oe_procedure: "testing the operating effectiveness of those controls to provide reasonable assurance that the service commitments and system requirements were achieved based on the applicable trust services criteria; and"
    independence: >-
      We are required to be independent of {org} and to meet our other ethical responsibilities, in accordance with
      the relevant ethical requirements related to the examination engagement.
  limitations:
    heading: "Inherent Limitations"
    text: >-
      The description is prepared to meet the common needs of a broad range of report users and may not include
      every aspect of the system that an individual user considers important. Because of their nature, controls may
      not always operate effectively to provide reasonable assurance that the service commitments and system
      requirements are achieved. Projecting any evaluation of effectiveness to future periods carries the risk that
      controls become inadequate because conditions change, or that compliance with policies and procedures declines.
  tests_description:
    heading: "Description of Tests of Controls"
    text: "The specific controls we tested, and the nature, timing and results of those tests, are listed in Section IV."
  basis:
    heading: "Basis for {basis_heading} Opinion"
  opinion:
    heading: "Opinion"
    unmodified: "In our opinion, in all material respects:"
    qualified: "In our opinion, except for the effects of the matters described in the Basis for Qualified Opinion paragraph, in all material respects:"
    adverse: "In our opinion, because of the significance of the matters described in the Basis for Adverse Opinion paragraph:"
    disclaimer: >-
      Because of the significance of the matters described in the Basis for Disclaimer of Opinion paragraph, we have
      not been able to obtain sufficient appropriate evidence to provide a basis for an opinion. Accordingly, we do
      not express an opinion on the description or on the suitability of design{and_oe_lc} of the controls stated in it.
    items:
      description: "the description presents {org}'s {system} that was designed and implemented {period} in accordance with the description criteria;"
      design: "the controls stated in the description were suitably designed {period} to provide reasonable assurance that {org}'s service commitments and system requirements would be achieved based on the applicable trust services criteria, if its controls operated effectively{complementary};"
      operating: "the controls stated in the description operated effectively {period} to provide reasonable assurance that {org}'s service commitments and system requirements were achieved based on the applicable trust services criteria{complementary}."
    adverse_items:
      design: "the controls stated in the description were not suitably designed {period} to provide reasonable assurance that {org}'s service commitments and system requirements would be achieved based on the applicable trust services criteria;"
      operating: "the controls stated in the description did not operate effectively {period} to provide reasonable assurance that {org}'s service commitments and system requirements were achieved based on the applicable trust services criteria."
    complementary: ", and if the complementary controls assumed in the design of {org}'s controls operated effectively"
  restricted_use:
    heading: "Restricted Use"
    text: >-
      This report{tests_clause} is intended solely for the information and use of {org}; user entities of the {system} {period}; business partners of {org}
      that are subject to risks arising from interactions with the system; practitioners who provide services to such
      user entities and business partners; prospective user entities and business partners; and regulators. These
      parties are expected to understand the nature of the service provided, how the system interacts with user
      entities and business partners, internal control and its limitations, complementary controls and how they
      interact with the service organization's controls, the applicable trust services criteria, and the risks that
      may threaten the achievement of the service commitments and system requirements. This report is not intended
      to be, and should not be, used by anyone other than these specified parties.

section2:
  title: "{org}'s Management Assertion"
  intro: >-
    We have prepared the accompanying description of {org}'s {system} {period} (the description) based on the
    description criteria in {description_criteria}. The description is intended to give users information about the
    system that may be useful in understanding the risks arising from interactions with it, particularly information
    about the suitability of design{and_oe_lc} of the controls stated in it to meet the applicable trust services
    criteria set forth in {trust_services_criteria}.
  confirm: "We confirm, to the best of our knowledge and belief, that:"
  items:
    description: "the description presents the {system} that was designed and implemented {period} in accordance with the description criteria;"
    design: "the controls stated in the description were suitably designed {period} to provide reasonable assurance that our service commitments and system requirements would be achieved based on the applicable trust services criteria, if the controls operated effectively{complementary_mgmt};"
    operating: "the controls stated in the description operated effectively {period} to provide reasonable assurance that our service commitments and system requirements were achieved based on the applicable trust services criteria{complementary_mgmt}."
  complementary_mgmt: ", and if the complementary controls assumed in the design of our controls operated effectively"
  signature: "Management of {org}"

section3:
  title: "{org}'s Description of Its {system}"
  headings:
    overview: "Company Overview"
    services: "Services Provided"
    commitments: "Principal Service Commitments and System Requirements"
    components: "Components of the System"
    boundaries: "System Boundaries"
    subservice_organizations: "Subservice Organizations and Complementary Subservice Organization Controls"
    cuecs: "Complementary User Entity Controls"
    incidents: "System Incidents"
    changes: "Significant Changes During the Period"
  component_names:
    infrastructure: "Infrastructure"
    software: "Software"
    people: "People"
    procedures: "Procedures"
    data: "Data"

section4:
  title: "Trust Services Criteria, Related Controls, and Tests of Controls"
  intro:
    type2: >-
      This section lists, for each applicable trust services criterion, the controls {org} has in place, the tests
      {auditor} performed {period}, and the results. The criteria and the controls that address them are the
      responsibility of {org}; the tests and results are the responsibility of {auditor}.
    type1: >-
      This section lists, for each applicable trust services criterion, the controls {org} has in place {period}.
      The criteria and controls are the responsibility of {org}. {auditor} evaluated the suitability of their design
      and confirmed that they were implemented; operating effectiveness was not tested.
  methods: >-
    Tests used one or more of these methods. Inquiry: asking appropriate personnel about the control. Observation:
    watching the control being performed. Inspection: examining documents, records and system configurations for
    evidence the control operated. Reperformance: independently executing the control and comparing results.
    Inquiry alone was never relied on. Where a control operated many times, a sample was selected at random using
    a recorded seed, with sample sizes based on the frequency of the control and the size of the population.
  columns: ["Control", "Control activity", "Tests performed", "Results"]
  columns_type1: ["Control", "Control activity"]
  no_exceptions: "No exceptions noted."
  not_tested: "Not tested. {reason}"
  design_deficiency: "Control not suitably designed. {reason}"

section5:
  title: "Other Information Provided by {org}"
  intro: >-
    The information in this section is presented by {org} to provide additional information and is not part of the
    description. It has not been subjected to the procedures applied in the examination, and accordingly {auditor}
    expresses no opinion on it.
  none: "Management did not provide additional information."
