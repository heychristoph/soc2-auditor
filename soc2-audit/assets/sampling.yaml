# Default sample sizes for tests of operating effectiveness (Type 2).
# These are common starting points, not a standard. Replace them with your
# firm's sampling methodology; `soc2.py sample` reads this file every run.

# Controls that happen on a fixed schedule. The population is the set of
# occurrences in the period (e.g. every month), generated by the script.
periodic:
  annual: 1
  semiannual: 2
  quarterly: 2
  monthly: 2
  weekly: 5
  daily: 25
  multiple-daily: 40

# Controls that happen when something occurs (a hire, a change, an incident).
# The population comes from a population file in the bundle. The first row whose
# `max_population` is >= the population size applies; `all` tests every item.
event:
  - {max_population: 5, size: all}
  - {max_population: 25, size: 5}
  - {max_population: 100, size: 10}
  - {max_population: 250, size: 15}
  - {max_population: null, size: 25}

# Automated and continuous controls: test one instance, relying on tested
# general IT controls (change management, logical access) for consistency.
automated: 1

# Type 1 engagements test design and implementation with one walkthrough.
type1: 1
